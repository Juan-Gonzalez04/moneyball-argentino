services:
  postgres:
    image: postgres:15-alpine
    container_name: afa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${DATA_PATH:-./data}/database:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    mem_limit: 1.5g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - moneyball

  # Python app (ETL)
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afa-etl
    restart: unless-stopped
    environment:
      - DB_URL=${DB_URL}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_NAME=${DB_NAME}
      - AFA_PLAYERS_STATS_URL=${AFA_PLAYERS_STATS_URL}
      - AFA_TEAMS_STATS_URL=${AFA_TEAMS_STATS_URL}
    volumes:
      - ./etl:/app/etl
      - ./scripts:/app/scripts
      - ${DATA_PATH:-./data}/raw:/data/raw
      - ${DATA_PATH:-./data}/processed:/data/processed
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - moneyball
    command: /bin/bash /app/scripts/entrypoint_etl.sh

  # Streamlit dashboard 
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afa-streamlit
    restart: unless-stopped
    environment:
      - DB_URL=${DB_URL}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_NAME=${DB_NAME}
    volumes:
      - ./scripts:/app/scripts
      - ./dashboard:/app/dashboard
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - moneyball
    command: streamlit run dashboard/app.py --server.address 0.0.0.0

networks:
  moneyball:
    driver: bridge
